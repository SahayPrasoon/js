<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code </title>
</head>
<body style="background-color: #212121; color: #fff;">
    
</body>
<script>
    const div = document.createElement('div') // createing a div element
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1) // yaha toh math library mei non 0 element ka hisab hai 
    div.setAttribute("title", "generated title") // adding title  through setAttribute // yeh jyada better hai to add the value 
    // //we can add style 
    div.style.backgroundColor = "black"
    div.style.padding = "12px"
    // div.innerText = "Chai aur code" // this selects the value and overwrites it not recommnended


    const addText = document.createTextNode("Chai aur code")
    div.appendChild(addText)

    document.body.appendChild(div) // here we are attaching it document to the page 
</script>
</html>
