<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code | DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    //creating & adding element in the list :need to traverse whole list and then append at the bottom
    function addLanguage(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`
        document.querySelector('.language').
        appendChild(li)
    }
    addLanguage("python")
    addLanguage("typescript")

    // adding the value in created li element list 
    //better way to add things in list optimized baar baar list create nhi karna traversal easy
    function addOptiLanguage(langName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('golang')

    //Edit
    const secondLang = document.querySelector("li:nth-child(2)") //better way to select nth child(n)
    console.log(secondLang);
    secondLang.innerHTML = "Mojo" //over write the second langName in li -- python
    const newli = document.createElement('li')
    newli.textContent = "mojo"
    secondLang.replaceWith(newli) //changes the element in the newly added langName 

    // //edit
    const firstLang = document.querySelector("li:first-child")
    firstLang.outerHTML = '<li>TypeScript</li>' //over write/edit the first element in the language

    // //remove the element 
    const lastLang = document.querySelector('li:last-child') //last child selected
    lastLang.remove()


</script>
</html>
