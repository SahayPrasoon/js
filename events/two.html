<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>
   const name = function(){
    console.log("prasoon")
   }

   //function use karke setTimeout ke through time stipulated change 
   const changeText = function(){
    document.querySelector('h1').innerHTML = "js is good"
   }

   const changeMe = setTimeout(changeText, 2000);

   document.querySelector('#stop').addEventListener('click', function(){
        clearTimeout(changeMe) // stops the callback queue and clears it, cancel execution of event
        console.log("STOPPED")
    })
    //here we are getting a direct change 
//    document.querySelector('h1').textContent = "js is good"
</script>
</html>
