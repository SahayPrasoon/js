<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121;">
    0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete.
</body>

<script>
    //task to create a button with a click to check on image and company of it 
   const requestURL = "https://api.github.com/users/mojombo"; // Replace with your API endpoint
   const chr = new XMLHttpRequest();
   chr.open('GET', requestURL);
    // Logs the initial readyState (0)
    chr.onreadystatechange = function() {
        console.log(chr.readyState);

        if(chr.readyState === 4) {
            const data = JSON.parse(this.responseText); //json parse changes string to object then we are able to fetch the data 
            console.log(typeof data);
            console.log(data.company);
            console.log(data)
        }
    }
   chr.send();
</script>
</html>
